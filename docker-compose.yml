services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://cloudpulse:${POSTGRES_PASSWORD}@db:5432/cloudpulse
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: http://localhost:5173
      DEMO_BASE_URL: http://backend:8000
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
